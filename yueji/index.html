<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅迹 · 读书打卡原型 · 设计原型集</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #1f2a37;
      --sub: #5b6573;
      --muted: #8a94a6;
      --line: #e7edf4;
      --primary: #2563eb;
      --primary-soft: #eff4ff;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.05);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(820px 380px at 6% -8%, rgba(37, 99, 235, 0.10), transparent 62%),
        radial-gradient(680px 340px at 100% 2%, rgba(245, 158, 11, 0.09), transparent 58%),
        linear-gradient(180deg, #eef3f9, var(--bg) 46%, #eef2f8);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 64px 24px 56px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 26px;
      color: var(--sub);
      font-size: 13px;
      text-decoration: none;
    }
    .back:hover { color: var(--primary); }

    .head { margin-bottom: 34px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 26px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .eyebrow i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }
    h1 {
      margin: 16px 0 10px;
      font-size: 32px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .lead {
      margin: 0;
      max-width: 640px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.75;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .item {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 22px 22px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .item:hover {
      transform: translateY(-3px);
      border-color: #cfdcea;
      box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 16px 36px rgba(16, 24, 40, 0.09);
    }
    .item:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .idx {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .item:hover .idx { background: var(--primary); color: #fff; }
    .arrow {
      color: var(--muted);
      font-size: 15px;
      transition: transform 0.18s ease, color 0.18s ease;
    }
    .item:hover .arrow { transform: translateX(3px); color: var(--primary); }

    .item h2 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .item p {
      margin: 0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.68;
      flex: 1;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
    }
    .tag {
      font-size: 11px;
      color: #64748b;
      background: #f5f8fc;
      border: 1px solid #e8eef6;
      border-radius: 999px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    .foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #e3eaf3;
      color: var(--muted);
      font-size: 12px;
    }
    .foot a { color: var(--sub); text-decoration: none; border-bottom: 1px solid #d5dfea; }
    .foot a:hover { color: var(--primary); border-color: var(--primary); }

    @media (max-width: 640px) {
      .shell { padding: 40px 18px 40px; }
      h1 { font-size: 25px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="../">← 返回原型集</a>
    <header class="head">
      <span class="eyebrow"><i></i>阅迹 · 读书打卡</span>
      <h1>阅迹 · 读书打卡原型</h1>
      <p class="lead">移动端读书打卡应用的原型，含阅读足迹、书架、打卡、共读圈等页面。全部为纯静态页面，数据为演示示例。</p>
    </header>

    <section class="grid">
      <a class="item" href="./h5-interactive.html">
        <div class="item-top">
          <span class="idx">01</span>
          <span class="arrow">→</span>
        </div>
        <h2>H5 可交互原型</h2>
        <p>手机端可点击操作的完整流程：书架选书、阅读打卡、足迹回顾、共读圈互动，页面之间可以真实跳转。</p>
        <div class="tags">
          <span class="tag">移动端</span>
          <span class="tag">可交互</span>
        </div>
      </a>

      <a class="item" href="./high-fidelity.html">
        <div class="item-top">
          <span class="idx">02</span>
          <span class="arrow">→</span>
        </div>
        <h2>高保真原型</h2>
        <p>核心页面一次性铺开的视觉全览，适合评审和走查整体设计风格，不含页面跳转。</p>
        <div class="tags">
          <span class="tag">全览图</span>
          <span class="tag">视觉稿</span>
        </div>
      </a>
    </section>

    <footer class="foot">
      <span>静态原型 · 无后端依赖，双击 HTML 也能本地打开</span>
      <a href="https://github.com/zhanghui-new/prototype" target="_blank" rel="noopener">源码仓库</a>
    </footer>
  </main>
</body>
</html>
